    ats: greenhouse
    board_token: anthropic
    collection_status: critical
    strategic_themes: [ai_security, ai_evaluation, trust_and_safety]
    career_url: https://www.anthropic.com/careers
    verification_status: VERIFIED
    last_successful_check: "2026-08-22"
    source_health: HEALTHY

