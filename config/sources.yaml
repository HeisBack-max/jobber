# Company / source registry for the MVP ATS collectors. This list is
# separate from config/strategic_companies.yaml: this file is the set of
# boards the Greenhouse/Lever/Ashby collectors will actually poll. Every
# entry here should have a verification_status of VERIFIED before being
# relied upon in a production run (see scripts/verify_boards.py).
#
# collection_status values: critical | high_priority | normal |
# exploratory | muted | blacklisted

companies:
  - name: Anthropic
    ats: greenhouse
    board_token: anthropic
    collection_status: critical
    strategic_themes: [ai_security, ai_evaluation, trust_and_safety]
    career_url: https://www.anthropic.com/careers
    verification_status: VERIFIED
    last_successful_check: "2026-08-14"
    last_changed: null
    source_health: HEALTHY

  - name: Mistral AI
    ats: lever
    board_token: mistral
    collection_status: critical
    strategic_themes: [ai_training, ai_security]
    career_url: https://mistral.ai/careers
    verification_status: VERIFIED
    last_successful_check: "2026-08-14"
    last_changed: null
    source_health: HEALTHY
    notes: "API responds 200 with a valid (currently empty) list - 0 open roles on this board right now is a legitimate result, not a broken token. Recheck periodically rather than assuming misconfiguration."

  - name: Cohere
    ats: ashby
    board_token: cohere
    collection_status: critical
    strategic_themes: [ai_training, ai_consulting]
    career_url: https://cohere.com/careers
    verification_status: VERIFIED
    last_successful_check: "2026-08-14"
    last_changed: "2026-08-14"
    source_health: HEALTHY
    notes: "Corrected from an earlier greenhouse:cohere entry, which 404'd. That token belonged to a different, unrelated company (Cohere Health, a healthcare startup) - the AI company Cohere is on Ashby, not Greenhouse."

  - name: Databricks
    ats: greenhouse
    board_token: databricks
    collection_status: critical
    strategic_themes: [ai_training, technical_training]
    career_url: https://www.databricks.com/company/careers
    verification_status: VERIFIED
    last_successful_check: "2026-08-14"
    last_changed: null
    source_health: HEALTHY

  - name: ElevenLabs
    ats: ashby
    board_token: elevenlabs
    collection_status: critical
    strategic_themes: [ai_training]
    career_url: https://elevenlabs.io/careers
    verification_status: VERIFIED
    last_successful_check: "2026-08-14"
    last_changed: null
    source_health: HEALTHY

  - name: Scale AI
    ats: greenhouse
    board_token: scaleai
    collection_status: critical
    strategic_themes: [ai_evaluation, gig_project_work]
    career_url: https://scale.com/careers
    verification_status: VERIFIED
    last_successful_check: "2026-08-14"
    last_changed: null
    source_health: HEALTHY

# Additional boards may be appended here as they are manually verified via
# `python scripts/verify_boards.py`. Do not add a company without first
# confirming a board_token resolves - a wrong token silently returns 404
# and would look like "zero jobs" rather than "misconfigured source".
