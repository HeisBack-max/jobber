# Company / source registry for the ATS collectors. This list is separate
# from config/strategic_companies.yaml: this file is the set of boards the
# collectors actually poll. Every entry here should have a
# verification_status of VERIFIED before being relied upon in a production
# run (see scripts/verify_boards.py).
#
# collection_status values: critical | high_priority | normal |
# exploratory | muted | blacklisted
#
# `muted` means "adapter exists, token not yet confirmed live from this
# machine" - the entry ships, `jobintel verify-boards` checks it, and it
# starts being polled only once someone flips it to normal/critical. That
# is how a board is added without inventing coverage that doesn't exist.
#
# Supported `ats` values (see src/jobintel/discovery/registry.py):
#   greenhouse | lever | ashby | workday | smartrecruiters | workable |
#   recruitee | careersite_microsoft | careersite_amazon | careersite_google
#
# `options:` carries per-source knobs (lever `region: eu`, workday/
# smartrecruiters `max_jobs`, career-site `queries`/`results_per_query`).

companies:
  # --- Frontier AI labs and AI platform companies ---
