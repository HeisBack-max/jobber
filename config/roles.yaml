negative_matching:
  # MANDATORY_MISMATCH: fatal, unless the CV supports it.
  mandatory_mismatch_signals:
    - "8+ years of full-time software engineering"
    - "production Kubernetes"
    - "active US security clearance"
    - "US citizenship required"
    - "medical licence required"
    - "PhD required"
    - "completed master's degree required"
    - "deep SOC operations experience"
    - "senior cloud architecture experience"
    - "professional ML research / publication history required"
    - "language requirement not supported by CV"
  # PREFERRED_REQUIREMENT_GAP: notable but non-fatal.
  preferred_gap_signals:
    - "preferred vendor certification"
    - "nice to have: cloud certification"
    - "familiarity with proprietary LMS"
    - "preferred: additional language"
