# Strategic company / source watchlist.
#
# `ats` + `board_token` are only filled in where the collector adapter can
# verify a live, working public board today. Verification status:
#   VERIFIED       - board_token confirmed reachable via the adapter as of
#                     last_checked (see scripts/verify_boards.py)
#   UNVERIFIED     - company is on the watchlist but no public Greenhouse/
#                     Lever/Ashby board has been confirmed yet; requires
#                     manual research or a future non-ATS collector
#                     (career-site HTML / search discovery)
#   NO_PUBLIC_ATS  - company does not expose jobs through Greenhouse,
#                     Lever, or Ashby; needs a dedicated career-site or
#                     search-discovery collector (future work)
#
# Company nationality/HQ NEVER determines candidate eligibility - that is
# decided per-vacancy by the geography engine. This registry only decides
# *which employers get deliberately, proactively checked* every run.

tiers:
  critical:
    description: "Tier 1 - checked every run, monitored for exceptional matches"
    companies:
      - name: OpenAI
        watch_priority: critical
        strategic_themes: [ai_evaluation, ai_security, trust_and_safety, ai_deployment, customer_enablement, technical_success]
        career_url: https://openai.com/careers/
        ats: null
        board_token: null
        verification_status: UNVERIFIED
        notes: "No confirmed public Greenhouse/Lever/Ashby board as of verification date; careers site appears to run a custom ATS. Requires a dedicated career-site collector (future work). Monitor via search discovery in the interim."
      - name: Google
        watch_priority: critical
        strategic_themes: [google_vertex_ai, ai_training, ai_consulting]
        career_url: https://www.google.com/about/careers/applications/
        ats: null
        board_token: null
        verification_status: NO_PUBLIC_ATS
        notes: "Google Careers runs a proprietary careers platform, not Greenhouse/Lever/Ashby. Requires search-discovery collector."
      - name: Google DeepMind
        watch_priority: critical
        strategic_themes: [google_vertex_ai, ai_evaluation, ai_security]
        career_url: https://deepmind.google/about/careers/
        ats: null
        board_token: null
        verification_status: NO_PUBLIC_ATS
      - name: Anthropic
        watch_priority: critical
        strategic_themes: [ai_security, ai_evaluation, trust_and_safety]
        career_url: https://www.anthropic.com/careers
        ats: greenhouse
        board_token: anthropic
        verification_status: UNVERIFIED
        notes: "Historically Greenhouse-hosted; token must be reconfirmed by scripts/verify_boards.py before relying on it. Anthropic must NEVER receive a company-wide remote classification - evaluate every vacancy's individual location/travel language."
      - name: NVIDIA
