        ats: careersite_amazon
        board_token: amazon
        verification_status: UNVERIFIED
        notes: "Career-site collector implemented against amazon.jobs/en/search.json. Muted until verified live."
      - name: Meta
        watch_priority: critical
        strategic_themes: [ai_training, responsible_ai]
        career_url: https://www.metacareers.com/
        ats: null
        board_token: null
        verification_status: NO_PUBLIC_ATS
        notes: "metacareers.com serves listings through an authenticated GraphQL endpoint with no public JSON search API. Probed against Greenhouse/Lever/Ashby 2026-08-22: nothing. Remains genuinely uncovered - this is the one Tier-1 employer with no collectable channel, and the dashboard's Source Health tab says so rather than implying coverage."
