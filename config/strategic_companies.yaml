# Strategic company / source watchlist.
#
# `ats` + `board_token` are only filled in where the collector adapter can
# verify a live, working public board today. Verification status:
#   VERIFIED       - board_token confirmed reachable via the adapter as of
#                     last_checked (see scripts/verify_boards.py) AND
#                     identity-checked: the board's own name / sample
#                     posting text confirms it belongs to this company
#   UNVERIFIED     - company is on the watchlist but no public board has
#                     been confirmed yet; either an adapter exists and the
#                     token is unconfirmed (entry is `muted` in
#                     config/sources.yaml), or no channel has been found
#   NO_PUBLIC_ATS  - company does not expose jobs through any public JSON
#                     endpoint this app can collect
#
# Company nationality/HQ NEVER determines candidate eligibility - that is
# decided per-vacancy by the geography engine. This registry only decides
# *which employers get deliberately, proactively checked* every run.

tiers:
  critical:
    description: "Tier 1 - checked every run, monitored for exceptional matches"
    companies:
      - name: OpenAI
        watch_priority: critical
        strategic_themes: [ai_evaluation, ai_security, trust_and_safety, ai_deployment, customer_enablement, technical_success]
        career_url: https://openai.com/careers/
        ats: ashby
        board_token: openai
        verification_status: VERIFIED
        notes: "Resolved 2026-08-22: OpenAI does run a public Ashby board (confirmed live, 754 postings, sample content identity-checked). The earlier 'custom ATS, needs a career-site collector' assessment was wrong - the board simply isn't linked from the careers page navigation."
      - name: Google
        watch_priority: critical
        strategic_themes: [google_vertex_ai, ai_training, ai_consulting]
        career_url: https://www.google.com/about/careers/applications/
        ats: careersite_google
        board_token: google
        verification_status: UNVERIFIED
        notes: "Career-site collector implemented (collectors/careersite.py) against the public careers.google.com search JSON. Muted in config/sources.yaml until `jobintel verify-boards` returns a live 200 - the environment this was written in blocks the host at the network-policy layer, so it could not be confirmed here."
      - name: Google DeepMind
        watch_priority: critical
        strategic_themes: [google_vertex_ai, ai_evaluation, ai_security]
        career_url: https://deepmind.google/about/careers/
        ats: null
        board_token: null
        verification_status: NO_PUBLIC_ATS
        notes: "Probed against Greenhouse/Lever/Ashby 2026-08-22: no public board. DeepMind roles are posted through Google's careers platform, so the Google career-site collector covers them once verified."
      - name: Anthropic
        watch_priority: critical
        strategic_themes: [ai_security, ai_evaluation, trust_and_safety]
        career_url: https://www.anthropic.com/careers
        ats: greenhouse
        board_token: anthropic
        verification_status: VERIFIED
        notes: "Anthropic must NEVER receive a company-wide remote classification - evaluate every vacancy's individual location/travel language."
      - name: NVIDIA
