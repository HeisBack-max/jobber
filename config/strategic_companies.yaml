# Companies default to `board_token: null / verification_status: UNVERIFIED`
# unless independently reconfirmed. scripts/verify_boards.py performs a
# live HTTP check against each configured (ats, board_token) pair without
# ever assuming a historical API is still current, and identity-checking
# a new board (does its own name / sample posting match the company you
# think it is?) is part of promoting it to VERIFIED - `greenhouse:cohere`
# and `greenhouse:figure` are both real boards belonging to entirely
# different companies than their tokens suggest.
