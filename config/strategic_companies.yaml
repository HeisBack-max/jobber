# Companies default to `board_token: null / verification_status: UNVERIFIED`
# unless independently reconfirmed. scripts/verify_boards.py performs a
# live HTTP check against each configured (ats, board_token) pair and
# updates last_checked / source_health without ever assuming a historical
# API is still current.
