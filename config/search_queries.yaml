# Configurable search-discovery query families (Milestone 6 / future
# search-engine discovery collector). Queries are grouped by theme so new
# ones can be added without touching application code. `recency_days`
# hints the discovery collector to prefer date-filtered search where the
# backing search API supports it.

query_families:
  ai_training:
    recency_days: 14
    queries:
      - '"AI trainer" remote'
      - '"generative AI trainer" remote'
      - '"AI enablement" remote jobs'
      - '"AI adoption" remote'
      - '"technical trainer" AI remote'
      - '"AI curriculum" remote'
      - '"AI education specialist" remote'
      - '"customer education" AI remote'

  cybersecurity:
    recency_days: 14
    queries:
      - '"AI security trainer" remote'
      - '"cybersecurity trainer" remote'
      - '"LLM security" remote'
      - '"AI red team" remote'
      - '"AI evaluator" remote'
      - '"instructional designer" cybersecurity remote'
      - '"AI safety evaluator" remote'

  google_ecosystem:
    recency_days: 21
    queries:
      - '"Vertex AI" trainer remote'
      - '"Vertex AI" consultant remote'
      - '"Gemini" enablement remote'
      - '"Google Cloud AI" trainer'

  responsible_ai:
    recency_days: 21
    queries:
      - '"responsible AI" training remote'
      - '"AI governance" training remote'
      - '"AI risk" education remote'

  gigs:
    recency_days: 7
    queries:
      - '"AI evaluator" freelance remote'
      - '"LLM red team" contract remote'
      - '"AI model evaluation" project remote'
      - '"prompt evaluation" freelance'

# Search-discovery collectors (src/jobintel/discovery/search.py). These
# query public remote-job search APIs with the families above, so a role
# matching Richard's profile can surface from an employer nobody put on
# the watchlist - and so strategic employers with no collectable ATS
# (Meta, Hugging Face) still have some channel.
#
# Disabled by default, exactly like a muted board in config/sources.yaml:
# both backends were unreachable from the environment this was written in
# (the network policy blocks them), so nothing here has been confirmed
# live. Turn a backend on only after `jobintel verify-search` reports it
# reachable - the pipeline should never quietly depend on an unproven
# source.
#
# Anything discovered this way is recorded as source_type=aggregator with
# a worse quality_rank than an ATS record: an employer's own posting
# always overwrites the aggregator copy, and an aggregator-only job takes
# the `aggregator_only_source` confidence deduction from
# config/scoring.yaml.
search_discovery:
  backends:
    remotive: false
    remoteok: false
  # Which query families to use; omit or set to null for all of them.
  families:
    - ai_training
    - cybersecurity
    - google_ecosystem
    - responsible_ai
  max_queries_per_run: 8

# Plain keyword terms for the employer career-site collectors
# (collectors/careersite.py). Kept separate from `query_families` because
# those employers' APIs take bare keywords, not search-engine syntax.
career_site_terms:
  - AI trainer
  - AI enablement
  - technical trainer
  - cybersecurity training
  - instructional designer
  - customer education
  - responsible AI training
  - Vertex AI consultant
